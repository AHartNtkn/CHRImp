version: 2
goal:
  title: Identify the strongest CHR architecture
  slug: architecture-exploration
  kind: specific
  tranche: Comparative architectural exploration through a defensible recommendation
  status: done
  oracle:
    signal: Working comparisons resolve major architectural hypotheses and consequential combinations.
    cadence: After decision-changing experiments and at completion.
    final_proof: Measured compiler combination and separate static-join capability, exact
      semantic controls, adverse censored outcomes, memory tradeoff and scoped recommendation
      in notes/decision.md.
  intake:
    original_request: Define the best exploration strategy, create a goal and follow it; avoid
      microoptimization and expanding obligations.
    interpreted_outcome: Identify the strongest supported architectural configuration or tradeoff
      frontier through bounded experiments.
    input_shape: specific
    audience: Language owner
    authority: requested
    proof_type: decision
    completion_proof: Executable evidence supports the leading architectural claims and the
      recommendation.
    likely_misfire: Accumulating small improvements, research artifacts or mandatory candidates
      instead of resolving architectural choices.
    blind_spots_considered:
      - Interactions can reverse individual gains.
      - Unknown mathematical workloads exceed supplied synthesis examples.
      - Sharing already exists; representation cost and repeated derivations are separate
        questions.
    existing_plan_facts:
      - Five independent investigations supplied different priorities without supplied conversation
        history.
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed
visual_board:
  selected: none
  local:
    status: not_requested
    url: null
  reason: Use concise file state; a visual process surface does not advance this architectural
    decision.
active_task: null
tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    objective: Synthesize independent priority investigations into distinct hypotheses and
      select the first decision-changing experiment.
    inputs:
      - Five running independent research agents
      - ../../behavior-synthesis-performance.md
      - Source and semantic tests
    constraints:
      - Control-file edits only.
      - Do not turn all candidates into implementation tasks.
    expected_output:
      - Leading configurations, comparative rationale and one bounded experiment specification.
    receipt:
      result: done
      summary: Four distinct hypotheses identified; simple exclusive-control fusion has no
        eligible behavior-synthesis predicates; abstract failure requires finite operational
        coverage. Selected a bounded baseline discriminator before commissioning whole-head
        runtime work.
      note: notes/T001-hypotheses.md
      harness: codex
  - id: T002
    type: pm
    assignee: PM
    status: done
    objective: Measure whether whole-head reasoning can avoid substantial candidate scaling
      on the proposed witness; choose whether it merits a prototype.
    inputs:
      - notes/T001-hypotheses.md
      - examples/measure.rs
      - examples/measure/families.rs
      - examples/perf.py
    allowed_files:
      - examples/measure/architecture.rs
      - examples/measure.rs
    verify:
      - Focused oracle tests for any added measurement case
      - Bounded baseline campaign and existing unchanged control
    stop_if:
      - Declared budget expires; record result and reassess instead of automatic extension.
      - The witness fails to establish the predicted avoidable scaling.
    receipt:
      result: done
      summary: 35 completed observations validated exactly; empty-join 32-to-64 growth raises
        median completion from 80.26 to 691.77 ms. Whole-head feasibility warrants a prototype;
        no runtime code changed.
      note: notes/T002-baseline.md
      harness: codex
      commands:
        - cmd: Maintained supervise.run over generated CLI inputs; exact ordered multiset
            validation
          status: pass
  - id: T003
    type: worker
    assignee: Worker
    status: done
    objective: Implement a bounded source-driven comparison of whole-head feasibility and
      on-demand query plans in an isolated prototype; test correctness before timing.
    inputs:
      - notes/T002-baseline.md
      - /tmp/chr-arch-whole-head
    allowed_files:
      - /tmp/chr-arch-whole-head/examples/arch_whole_head.rs
    verify:
      - cargo test --offline --release --example arch_whole_head
      - cargo build --offline --release --example arch_whole_head
      - Exact relational output comparison with baseline on supported program class
    stop_if:
      - '45-minute implementation budget expires: return concrete result/remaining uncertainty,
        no automatic extension.'
      - Supporting the hypothesis requires full engine integration; do not expand prototype
        silently.
    receipt:
      result: done
      changed_files:
        - /tmp/chr-arch-whole-head/examples/arch_whole_head.rs
      commands:
        - cmd: cargo test --offline --release --example arch_whole_head (9 tests)
          status: pass
        - cmd: cargo build --offline --release --example arch_whole_head
          status: pass
        - cmd: 'Bounded supervisor campaign: all 55 completed observations exact; five Engine
            observations honestly censored'
          status: pass
      summary: Whole-head feasibility avoids 16.8 million candidates with 258 probes at n256;
        ~142x total-process gain over on-demand in same executor. No benefit established on
        connected/dense controls; general maintained views not justified by this static result.
      note: notes/T003-comparison.md
      commit: c95cc9f6b9231c84f67564930327e198fdc79ddd
      harness: codex
    agent_id: 01a09936-4ec2-79e3-bbb2-56c93f31bc24
  - id: T004
    type: pm
    assignee: PM
    status: done
    objective: Select and scope a representation-lowering experiment that includes conditional
      structural normalization and actual evaluator interaction.
    inputs:
      - notes/T001-hypotheses.md
      - notes/T003-comparison.md
      - Targeted Curie code-level feasibility study
    constraints:
      - Read-only source study; control-file updates only until prototype scope selected.
      - Do not expand the static join prototype by default.
    agent_id: 01a09935-dd83-7411-9e01-d83f1cbd9efa
    receipt:
      result: done
      summary: Scoped direct conditional normalization integrated with shared graph roots,
        using baseline/priority/direct attribution controls. Recognized subsystem becomes
