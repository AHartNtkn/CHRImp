version: 2
goal:
  title: Complete the CHR performance suite
  slug: performance-suite
  kind: recovery
  tranche: Implement the full prospective performance-risk coverage, maintained measurements, bounded regression
    detection and independent adversarial validation.
  status: active
  oracle:
    signal: Maintained native commands expose plausible unobserved performance failures across the source-backed
      risk model and correctly detect independently chosen time, memory, scaling, progress and lifecycle regressions.
    cadence: After coherent implementation packages and independent challenges.
    final_proof: 'All six completion-oracle clauses in goal.md have runnable reviewed evidence; no required suite
      gaps remain; final reviewer records full_outcome_complete: true.'
  intake:
    original_request: Create a FULL /goal which would COMPLETE the perf suite. Use brainstorming.
    interpreted_outcome: Anticipate future performance failures and build a validated practical suite that exposes
      them and detects regressions as the language/runtime evolve.
    input_shape: recovery
    audience: CHR users and developers
    authority: requested
    proof_type: test
    completion_proof: Independent challenges demonstrate prospective coverage, truthful measurement and actionable
      detection through maintained bounded commands.
    likely_misfire: Explaining the current slowdown, adding cases, or implementing audit counters stands in for
      anticipating unobserved failures.
    blind_spots_considered:
      - Previously unobserved risks derived from semantics, algorithms, ownership and interactions
      - Poor sensitivity and false alarms in regression detection
      - Legal variations beyond named workloads and calibration cases
      - Instrument distortion, censoring, external resource limits and reproducibility
    existing_plan_facts:
      - The user explicitly requires anticipating future failures, not organizing the goal around the current incident.
      - Use brainstorming.
      - Do not rerun rwLog.
      - Avoid administrative scope growth and open-ended optimization loops.
      - Broad mathematical uses must be considered without requiring user-supplied examples.
  repository: /home/ahart/Documents/CHRImp
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed
visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: ''
  reason: Use the native goal and compact files; a separate interface is outside the requested performance-suite
    outcome.
active_task: T002
tasks:
