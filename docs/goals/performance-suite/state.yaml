      - 'cargo clippy --example measure -- -D warnings and cargo fmt --check: pass.'
      - 'python3 -m unittest discover -s tests -p profile_test.py: 4 passed.'
      - '/tmp/chrimp-profile-verified/profile.json: 66 samples, validated complete behavior identity profile.'
