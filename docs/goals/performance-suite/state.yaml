      - notes/brainstorm.md
      - examples/measure.rs
      - examples/measure/
      - src/
      - tests/
    constraints:
      - Follow the full goal.md outcome; no rwLog runs or unrelated engine optimization.
      - Read-only; use independent brainstorming to challenge the risk model rather than treating existing cases
        as the scope.
    expected_output:
      - Compact source-backed prospective risk-to-evidence map and independent challenge findings.
      - Concrete bounded implementation package definitions, required verification and measurement-validity checks.
    receipt:
      result: done
      summary: Independent semantics and lifecycle reviews plus lead measurement-path inspection identify prospective
        risks and exact discriminating experiments. Implementation gaps remain open.
      note: notes/T001-risks.md
      evidence:
        - src/program.rs:176 and 209; src/matching.rs; examples/measure/families.rs
        - src/engine.rs:428; src/observe.rs:265; src/engine/inspection.rs:385; src/notebook.rs:158 and 910
